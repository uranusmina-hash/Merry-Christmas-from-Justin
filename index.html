<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>🎄 Merry Christmas from Justin! 🎄</title>

<!-- OPEN GRAPH META TAGS (FOR SOCIAL PREVIEW) -->
<meta property="og:title" content="🎄 Merry Christmas from Justin! 🎄">
<meta property="og:description" content="Scan my GCash QR and send your Christmas cheer! ❄️">
<meta property="og:image" content="https://namasko-si-justin.netlify.app/images/christmas-bg.jpg">
<meta property="og:url" content="https://namasko-si-justin.netlify.app/">
<meta property="og:type" content="website">

<!-- Twitter / Messenger Support -->
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>

<div class="overlay">
    <main class="card-christmas">

        <h1>🎄 Merry Christmas<br>from Justin! 🎄</h1>
        <p class="subtitle">Scan my GCash QR to send your Christmas cheer!</p>

        <div class="qr-wrapper">
            <img src="images/gcash-qr.jpg" class="qr" alt="GCash QR code">
            <img src="images/snowman.png" class="snowman left" alt="">
            <img src="images/snowman.png" class="snowman right" alt="">
        </div>

        <!-- AUDIO -->
        <audio id="christmasSong" loop>
            <source src="audio/christmas.mp3" type="audio/mpeg">
        </audio>

        <div>
            <button id="musicBtn" class="music-btn" type="button">🎵 Play Music</button>
        </div>

        <p class="thanks">Maraming salamat and God bless! 🎁</p>

    </main>
</div>

</body>
</html>
